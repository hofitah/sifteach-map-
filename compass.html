class Component extends DCLogic {
constructor(props) { super(props); this.state = { params: [], strengths: [] }; }
tog(g, i) { const o = Object.assign({}, this.state[g] || {}); o[i] = !o[i]; this.setState({ [g]: o }); }
list(g, items) { const s = this.state[g] || {}; return items.map((t, i) => ({ t: t, id: g + i, on: !!s[i], toggle: () => this.tog(g, i) })); }
renderVals() {
const mk = (g, all) => { const sel = this.state[g]; return all.map((t) => { const on = sel.indexOf(t) > -1; return { t: t, pressed: on ? 'true' : 'false', bg: on ? '#A8DDF5' : '#FFFFFF', bd: on ? '#1D6E9E' : '#E6D9BE',
  toggle: () => { const cur = this.state[g].slice(); const i = cur.indexOf(t); if (i > -1) cur.splice(i, 1); else if (cur.length < 4) cur.push(t); this.setState({ [g]: cur }); } }; }); };
return { params: mk("params", ["עניין", "שכר", "משרה מלאה", "משרה חלקית", "גמישות בשעות העבודה", "אפשרויות קידום", "עשיה עם משמעות", "עבודת צוות", "יוקרה של המקצוע", "שילוב של עבודה מהבית", "צבירת ניסיון רלוונטי"]), strengths: mk("strengths", ["יכולת ניתוח", "יצירתיות ומציאת פתרונות", "כושר מספרי ועבודה עם נתונים", "סדר וארגון", "ירידה לפרטים ודיוק", "יכולת למידה מהירה", "עצמאות ויוזמה", "התמדה ונחישות", "תקשורת בין-אישית", "יכולת הקשבה והבנת אנשים", "עבודה בצוות ושיתוף פעולה", "יכולת ביטוי והצגה מול קהל", "ניהול זמן ותעדוף משימות"]), pCount: this.state.params.length, sCount: this.state.strengths.length, pSel: this.state.params, sSel: this.state.strengths };
}
}

return Component;})();
