אני נועה כהן, בוגרת תואר ראשון בסוציולוגיה מהעברית, ומחפשת את ההזדמנות הרלוונטית שלי בעולמות ה-HR, הרווחה או הגיוס.

כדי שלא אהיה עוד קורות חיים בערימה, הנה 3 דברים שכדאי לדעת עליי:
1. חקרתי מוטיבציה באופן מעשי: פרויקט הגמר שלי עסק בקשר בין תחושת שייכות בארגון לשביעות רצון בעבודה – תחום שאני רוצה להביא אליכם הלכה למעשה.
2. אני ביצועיסטית: מביאה איתי שנה של ניסיון בעולם השירות והמכירות, מה שנתן לי "ארגז כלים" מעולה של תקשורת בינאישית, פתרון קונפליקטים והובלת משימות.
3. אני אוהבת דאטה לא פחות מאנשים: יודעת לאסוף, לנתח ולהסיק מסקנות ממידע – יתרון משמעותי לעולם ה-HR המודרני.
