<div style="max-width: 1040px; margin: 0 auto; padding: 48px 24px 72px; box-sizing: border-box">
<div data-hero style="display: flex; align-items: center; gap: 40px; flex-wrap: wrap"><div style="flex: 1 1 520px; min-width: 0"><span style="display: inline-block; background: #A8DDF5; color: #7A1C2B; font-size: 15px; font-weight: 900; padding: 6px 18px; transform: rotate(-1.5deg); clip-path: polygon(0 0, 100% 0, 98.6% 25%, 100% 50%, 98.6% 75%, 100% 100%, 0 100%, 1.4% 75%, 0 50%, 1.4% 25%)"><span class="stnum"></span>פנו לאדם אחד</span>
<h1 style="margin: 18px 0 16px; font-size: 44px; line-height: 1.08; font-weight: 800; color: #C1272D">לא מחכים למודעות –<br>יוצרים קשרים</h1></div><img src="ill-heart.png" alt="לב מנייר דבק" style="flex: none; width: 260px; height: 260px; border-radius: 32px; object-fit: cover; box-shadow: 0 10px 24px rgba(122,28,43,0.22)"></div>

<div style="display: flex; flex-direction: column; gap: 22px; margin-top: 32px">
<div style="align-self: flex-start; max-width: 720px; background: #7A1C2B; color: #FFFFFF; font-size: 20px; font-weight: 700; line-height: 1.45; padding: 14px 22px; border-radius: 24px 24px 24px 6px">מביך אותי לבקש דברים מאנשים. מרגיש לי לא נעים. מה הקשר עכשיו לפנות לאנשים שאני לא מכיר בשביל למצוא עבודה?</div>
<section style="background: #FFFFFF; border: 1px solid #E6D9BE; border-top: 8px solid #3FA3D9; border-radius: 6px; box-shadow: 0 6px 18px rgba(60,40,20,0.08); padding: 28px 30px; display: flex; flex-direction: column; gap: 14px"><h2 style="margin: 0; font-size: 26px; line-height: 1.25; font-weight: 800; color: #24211F">כמה אתם מזדהים עם המשפט הזה מ1 עד 10?</h2><div style="display: flex; align-items: center; gap: 16px"><span style="font-size: 17px; color: #1D6E9E">1</span><input id="rng" type="range" min="1" max="10" step="1" value="{{level}}" onInput="{{onLevel}}" aria-label="רמת הזדהות מ-1 עד 10" style="flex: 1 1 auto; height: 44px"><span style="font-size: 17px; color: #1D6E9E">10</span><output for="rng" style="width: 56px; text-align: center; font-size: 30px; font-weight: 800; color: #C1272D">{{level}}</output></div></section>
<p style="margin: 0; font-size: 20px; line-height: 1.6; color: #24211F; ">ואם מישהו היה פונה אלייך בוואטסאפ וכותב לך</p>
<div style="border: 3px solid #1E7A3C; align-self: flex-start; max-width: 560px; border-radius: 18px 18px 6px 18px; padding: 16px 20px; font-size: 20px; line-height: 1.6; white-space: pre-line; background-color: #DCF8C6">היי ! מה נשמע? :)
אני בודק עכשיו כיוונים בתחום ה_____ וראיתי שאת.ה שם.
יש מצב לשיחה קצרה של 10 דק׳? אשמח לשמוע ממך קצת על התחום ועל מה כדאי לדעת. אני זורם עם מתי שנוח לך</div>
<p style="margin: 0; font-size: 20px; line-height: 1.6; color: #24211F; "><b>מה היית חושבים על האדם שפנה? מה היית עונה לו?</b></p>
<p style="margin: 0; font-size: 20px; line-height: 1.6; color: #24211F; ">רוב הסיכויים שהיית עונה בשמחה וגם מנסה לעזור :)</p>
<p style="margin: 0; font-size: 20px; line-height: 1.6; color: #24211F; ">ובדיוק בגלל זה - זה סבבה לפנות לאנשים שאנחנו מכירים (גם אם הקשר הצטנן) וגם לאנשים שאנחנו לא מכירים (אבל הגענו אליהם דרך מישהו).</p>
<section aria-labelledby="selfT" style="background: #FFFFFF; border: 1px solid #E6D9BE; border-top: 8px solid #3FA3D9; box-shadow: 0 6px 18px rgba(60,40,20,0.08); border-radius: 28px; padding: 40px 44px; display: flex; flex-direction: column; gap: 22px">
